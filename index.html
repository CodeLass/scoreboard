<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
                
    </head>
    <body>
        <div class="container">
            <div class="scores-wrapper">
                <div class="container-home">
                    <h3>HOME</h3>
                    <div id="score-home" class="container-score">
                        
                    </div>
                    <div class="btn-row">
                        <button onclick="add('home', 1)" class="btn">+1</button>
                        <button onclick="add('home', 2)" class="btn">+2</button>
                        <button onclick="add('home', 3)" class="btn">+3</button>
                    </div>
                </div>
                <div class="container-guest">
                    <h3>GUEST</h3>
                    <div id="score-guest" class="container-score">
                        
                    </div>
                    <div class="btn-row">
                        <button onclick="add('guest', 1)" class="btn">+1</button>
                        <button onclick="add('guest', 2)" class="btn">+2</button>
                        <button onclick="add('guest', 3)" class="btn">+3</button>
                    </div>
                </div>
            </div>
            <div class="reset-button-wrapper">
                <button onclick="resetScore()" class="btn btn-reset">Reset</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
